# =============================================================================
#  Site configuration
#
#  This file holds settings that apply to the WHOLE site. If you change it,
#  you must restart `jekyll serve` for the change to show up (everything else
#  reloads automatically).
# =============================================================================

# --- Basic information -------------------------------------------------------

title: "Thibault de Surrel"          # shown in the browser tab and nav bar
description: >-                       # used by search engines and link previews
  PhD student at LAMSADE, Université Paris Dauphine-PSL, working on Riemannian
  geometry and machine learning for brain-computer interfaces.

url: "https://thibaultdesurrel.github.io"   # the live address of the site
baseurl: ""                                 # empty: the site lives at the root


# --- About you ---------------------------------------------------------------
# Everything here is used on the homepage. Change a value and it updates
# everywhere it appears.

author:
  name: "Thibault de Surrel"
  role: "PhD student"
  affiliation: "LAMSADE, Université Paris Dauphine-PSL"
  affiliation_url: "https://www.lamsade.dauphine.fr"
  location: "Paris, France"
  photo: "/images/profile_pic.jpeg"

  # Contact and profile links. Leave a line blank to hide that icon.
  email: "thibault.de-surrel@lamsade.dauphine.fr"
  scholar: "https://scholar.google.com/citations?user=CfShNGwAAAAJ&hl=fr&oi=ao"
  github: "https://github.com/thibaultdesurrel"
  linkedin: "https://www.linkedin.com/in/thibault-de-surrel"


# --- How much the homepage shows ---------------------------------------------
# The homepage is one long page, so the News and Publications sections stop
# after this many items and put the rest behind a "Show all …" button. Raise a
# number to show more at once; set it very high to never hide anything.

homepage:
  news_shown: 5
  publications_shown: 10


# --- Collections -------------------------------------------------------------
# A "collection" is a folder of content files. Each paper is one file in
# `_publications/`. `output: false` means Jekyll does NOT build a separate web
# page for each paper — they are all listed on the homepage instead.

collections:
  publications:
    output: false


# --- Technical settings ------------------------------------------------------
# You should not need to touch anything below this line.

markdown: kramdown          # the flavour of Markdown used in content files
kramdown:
  input: GFM                # GitHub-Flavored Markdown
  hard_wrap: false
highlighter: rouge          # syntax colouring for code blocks

sass:
  style: compressed         # minify the stylesheet when building

plugins:
  - jekyll-feed             # generates /feed.xml so people can subscribe
  - jekyll-sitemap          # generates /sitemap.xml for search engines

# Files and folders that should NOT be copied into the built site.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - LICENSE
  - vendor
  - .bundle
  - .claude
